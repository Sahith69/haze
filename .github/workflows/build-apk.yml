name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HAZE Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.enableMinifyInReleaseBuilds=false --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/HAZE-v1.0.0.apk
          echo "Built APK size and details:"
          ls -lh build-output/HAZE-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAZE-v1.0.0-APK
          path: build-output/HAZE-v1.0.0.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-latest
          name: "HAZE v1.0.0 (Latest Build)"
          body: |
            ### ⚡ HAZE - Lossless FLAC & Studio Master Audio Player
            
            **Included in this release:**
            - **Seamless Playback Continuity**: Closing and reopening the app restores your active song, queue, and playback timeline without resetting to default.
            - **Zero-Buffer Lossless FLAC Hot-Swapping**: Pre-downloads the 1,411 kbps FLAC in the background while 320k plays smoothly, then executes an instantaneous <10ms swap with zero silence or buffering.
            - **Language-Aware Matching**: Direct resolution preserves regional markers (`[Telugu]` vs `[Tamil]`) to guarantee bit-perfect matching.
            - **Pure Lossless Telegram Cloud Vault**: Auto-archives your streaming audio directly into high-fidelity FLAC in Telegram.
            
            📲 **Installation**: Tap `HAZE-v1.0.0.apk` below on your Android phone to download and install!
          files: build-output/HAZE-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
